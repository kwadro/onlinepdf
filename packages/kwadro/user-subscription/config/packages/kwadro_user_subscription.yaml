# Copy to config/packages/kwadro_user_subscription.yaml in your Symfony project.
kwadro_user_subscription:
    user_class: App\Entity\User
    default_plan_code: free
    auto_activate: false

    payment:
        default_provider: privat
        verify_monobank_signature: true
        providers:
            privat:
                enabled: true
                public_key: '%env(LIQPAY_PUBLIC_KEY)%'
                private_key: '%env(LIQPAY_PRIVATE_KEY)%'
                sandbox: '%env(bool:LIQPAY_SANDBOX)%'
                result_url: 'https://%env(APP_DOMAIN)%/subscription/payment/success'
                server_url: 'https://%env(APP_DOMAIN)%/webhook/payment/privat'
            monobank:
                enabled: true
                token: '%env(MONOBANK_TOKEN)%'
                redirect_url: 'https://%env(APP_DOMAIN)%/subscription/payment/success'
                webhook_url: 'https://%env(APP_DOMAIN)%/webhook/payment/monobank'
                invoice_validity: 86400

groups:
    catalog:
        translate:
            link:
                uk: Каталог
                en: Catalog
        entities:
            RecipeTranslation:
                translate:
                    link:
                        uk: Рецепти (переклад)
                        uk_single: Рецепт (переклад)
                        en: Recipes (translation)
                        en_single: Recipe (translation)
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: locale
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: Locale
                      inversedBy: recipelocales
                      roleRelation: master
                      typeInput: addNew
                      formSetting: code|code,name
                    - name: name
                      type: string
                      isrequire: true
                      isstring: true
                    - name: slug
                      type: string
                    - name: is_active
                      type: select
                      typeInput: yesno
                    - name: publish
                      type: select
                      typeInput: yesno
                    - name: is_popular
                      type: select
                      typeInput: yesno
                    - name: meta_title
                      type: string
                    - name: meta_description
                      type: text
                    - name: short_description
                      name_uk: Короткий опис
                      type: text
                    - name: description
                      name_uk: Опис
                      type: text
                      numOfRows: 10
                    - name: cuisine
                      name_uk: кухня
                      type: string
                    - name: notes
                      type: text
                      numOfRows: 3
                    - name: groupcomponents
                      isCollectionField: true
                      roleRelation: master
                      name_uk: Групи Компонентів
                      type: relation
                      objectRelation: GroupComponent
                      typeRelation: OneToMany
                      mappedBy: recipetranslation
                      typeInput: addNews
                    - name: recipesteps
                      isCollectionField: true
                      roleRelation: master
                      orderByField: position
                      orderBy: ASC
                      name_uk: кроки
                      type: relation
                      objectRelation: RecipeStep
                      typeRelation: OneToMany
                      mappedBy: recipetranslation
                      typeInput: addNews
                    - name: recipe
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: Recipe
                      inversedBy: recipetranslations
                    - name: user
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: User
                      roleRelation: master
                      typeInput: addNew
                      formSetting: email|email
                      inversedBy: recipes

            Recipe:
                relatedSaleAndLocale: list
                url_key_field: slug
                category_field: recipecategorys
                author_field: user
                translate:
                    link:
                        uk: Рецепти
                        uk_single: Рецепт
                        en: Recipes
                        en_single: Recipe
                import:
                    type: csv
                    resource: recipes.csv
                stringfield: site|id
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: site
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: Site
                      roleRelation: master
                      inversedBy: recipesites
                    - name: position
                      type: integer
                    - name: prep_time_min
                      name_uk: час підготовки
                      type: integer
                    - name: cook_time_min
                      name_uk: час приготування
                      type: integer
                    - name: servings
                      type: integer
                    - name: image
                      name_uk: Картинка
                      type: image
                      uploadDir: recipes
                    - name: recipecategorys
                      name_uk: Категорії
                      type: relation
                      objectRelation: RecipeCategory
                      typeRelation: ManyToMany
                      roleRelation: master
                      mappedBy: recipes
                    - name: recipetranslations
                      isCollectionField: true
                      type: relation
                      typeRelation: OneToMany
                      objectRelation: RecipeTranslation
                      mappedBy: recipe
                      roleRelation: master

            RecipeCategory:
                relatedSaleAndLocale: catalog
                default_field: parent
                url_key_field: slug
                translate:
                    link:
                        uk: Категорії
                        uk_single: Категорію
                        en: Categories
                        en_single: Category
                import:
                    type: json
                    resource: recipe_categories.json
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: name
                      name_uk: назва
                      type: string
                      isrequire: true
                      isstring: true
                    - name: slug
                      name_uk: лінк
                      type: string
                    - name: position
                      name_uk: позиція
                      type: integer
                    - name: is_active
                      name_uk: активний?
                      type: select
                      typeInput: yesno
                    - name: image
                      type: image
                      uploadDir: recipes
                    - name: meta_title
                      name_uk: мета тайтл
                      type: string
                    - name: meta_description
                      name_uk: мета опис
                      type: text
                    - name: parent
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: self
                      inversedBy: children
                    - name: children
                      type: relation
                      typeRelation: OneToMany
                      objectRelation: self
                      mappedBy: parent
                    - name: recipes
                      name_uk: рецепти
                      type: relation
                      objectRelation: Recipe
                      typeRelation: ManyToMany
                      roleRelation: slave
                      inversedBy: recipecategorys

            RecipeStep:
                translate:
                    link:
                        uk: Кроки Приготування
                        uk_single: Крок Приготування
                        en: Recipe Steps
                        en_single: Recipe Step
                import:
                    type: json
                    resource: recipe_categories.json
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: name
                      type: string
                      isrequire: true
                      isstring: true
                    - name: recipetranslation
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: RecipeTranslation
                      roleRelation: master
                      inversedBy: recipesteps
                    - name: position
                      type: integer
                    - name: question
                      type: text
                    - name: answer
                      type: text
                    - name: image
                      type: image
                      uploadDir: recipes

            Ingredient:
                translate:
                    link:
                        uk: Інградієнти
                        uk_single: Інградієнт
                        en: Ingredients
                        en_single: Ingredient
                import:
                    type: json
                    resource: recipe_categories.json
                fields:
                    - name: id
                      type: integer
                      id: true

                    - name: name
                      type: string
                      isrequire: true
                      isstring: true
                    - name: sku
                      type: string
                    - name: url
                      type: string
                    - name: price
                      type: money
                    - name: components
                      type: relation
                      objectRelation: Component
                      typeRelation: OneToMany
                      mappedBy: ingredient

            GroupComponent:
                translate:
                    link:
                        uk: Групи Компонентів
                        uk_single: Група Компонентів
                        en: Groups of Components
                        en_single: Group of Components
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: name
                      type: string
                      isrequire: true
                      isstring: true
                    - name: position
                      type: integer
                    - name: recipetranslation
                      type: relation
                      objectRelation: RecipeTranslation
                      typeRelation: ManyToOne
                      inversedBy: groupcomponents
                    - name: components
                      type: relation
                      objectRelation: Component
                      typeRelation: OneToMany
                      mappedBy: groupcomponent
                      typeInput: addNews
                      formSetting: id|name

            Component:
                translate:
                    link:
                        uk: Компоненти Рецепта
                        uk_single: Компонент Рецепта
                        en: Components
                        en_single: Component
                import:
                    type: json
                    resource: recipe_categories.json
                stringfield: ingredient->getName()|quantity|unit->getName()
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: position
                      type: integer
                    - name: ingredient
                      type: relation
                      objectRelation: Ingredient
                      typeRelation: ManyToOne
                      roleRelation: master
                      inversedBy: components
                      typeInput: addNew
                      formSetting: name|name,sku
                    - name: unit
                      type: relation
                      objectRelation: Unit
                      typeRelation: ManyToOne
                      roleRelation: master
                      inversedBy: components
                      typeInput: addNew
                      formSetting: name|name
                    - name: quantity
                      type: integer
                    - name: groupcomponent
                      type: relation
                      objectRelation: GroupComponent
                      typeRelation: ManyToOne
                      roleRelation: master
                      inversedBy: components

            Unit:
                translate:
                    link:
                        uk: Одиниці
                        uk_single: Одиниця
                        en: Units
                        en_single: Unit
                import:
                    type: json
                    resource: recipe_categories.json
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: name
                      type: string
                      isrequire: true
                    - name: short_name
                      type: string
                      isstring: true
                    - name: components
                      type: relation
                      objectRelation: Component
                      typeRelation: OneToMany
                      mappedBy: unit

    setting:
        translate:
            link:
                uk: Настройки Сайта
                en: Setting Site

        entities:
            Site:
                translate:
                    link:
                        uk: Сайти
                        uk_single: Сайт
                        en: Sites
                        en_single: Site
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: code
                      type: string
                      isrequire: true
                    - name: domain
                      type: string
                      isrequire: true
                      isstring: true
                    - name: headersettingsites
                      type: relation
                      typeRelation: OneToMany
                      objectRelation: HeaderSetting
                      mappedBy: site
                    - name: seosettingsites
                      type: relation
                      typeRelation: OneToMany
                      objectRelation: SeoSetting
                      mappedBy: site
                    - name: footersettingsites
                      type: relation
                      typeRelation: OneToMany
                      objectRelation: FooterSetting
                      mappedBy: site
                    - name: megamenusites
                      type: relation
                      typeRelation: OneToMany
                      objectRelation: MegaMenuSetting
                      mappedBy: site
                    - name: recipesites
                      type: relation
                      typeRelation: OneToMany
                      objectRelation: Recipe
                      mappedBy: site
                    - name: popularsearchsites
                      type: relation
                      typeRelation: OneToMany
                      objectRelation: Popularsearch
                      mappedBy: site

            Locale:
                translate:
                    link:
                        uk: Мови
                        uk_single: Мова
                        en: Locales
                        en_single: Locale
                fields:
                    -   name: id
                        type: integer
                        id: true
                    -   name: code
                        type: string
                        isrequire: true
                    -   name: name
                        type: string
                        isrequire: true
                        isstring: true
                    -   name: is_default
                        type: select
                        typeInput: yesno
                    -   name: headertranslatelocales
                        type: relation
                        typeRelation: OneToMany
                        objectRelation: HeaderTranslation
                        mappedBy: locale
                    -   name: footertranslatelocales
                        type: relation
                        typeRelation: OneToMany
                        objectRelation: FooterTranslation
                        mappedBy: locale
                    -   name: seosettingtranslatelocales
                        type: relation
                        typeRelation: OneToMany
                        objectRelation: SeoSettingsTranslation
                        mappedBy: locale
                    -   name: megamenutranslatelocales
                        type: relation
                        typeRelation: OneToMany
                        objectRelation: MegaMenuTranslation
                        mappedBy: locale
                    -   name: popularsearchlocales
                        type: relation
                        typeRelation: OneToMany
                        objectRelation: Popularsearch
                        mappedBy: locale

            HeaderSetting:
                relatedSaleAndLocale: single
                translate:
                    link:
                        uk: Настройки Заголовків
                        uk_single: Настройка Заголовка
                        en: Header Settings
                        en_single: Header Setting
                fields:
                    -   name: id
                        type: integer
                        id: true
                    -   name: site
                        type: relation
                        typeRelation: ManyToOne
                        objectRelation: Site
                        inversedBy: headersettingsites
                        isstring: true
                    -   name: translations
                        type: relation
                        typeRelation: OneToMany
                        objectRelation: HeaderTranslation
                        mappedBy: headersetting
                    -   name: logo
                        type: image
                        uploadDir: logo
                    -   name: favicon
                        type: image

            HeaderTranslation:
                translate:
                    link:
                        uk: Переклад Заголовків
                        uk_single: Переклад Заголовка
                        en: Header Translations
                        en_single: Header Translation
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: headersetting
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: HeaderSetting
                      inversedBy: translations
                      isstring: true
                    - name: locale
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: Locale
                      inversedBy: headertranslatelocales
                    - name: title
                      type: string
                    - name: menu_json
                      type: string

            SeoSetting:
                relatedSaleAndLocale: single
                translate:
                    link:
                        uk: Seo Настройки
                        uk_single: Seo Настройка
                        en: Seo Settings
                        en_single: Seo Setting
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: site
                      isstring: true
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: Site
                      inversedBy: seosettingsites
                    - name: translations
                      type: relation
                      typeRelation: OneToMany
                      objectRelation: SeoSettingsTranslation
                      mappedBy: seosetting

            SeoSettingsTranslation:
                translate:
                    link:
                        uk: Seo Настройки Переклад
                        uk_single: Seo Настройка Переклад
                        en: Seo Settings Translation
                        en_single: Seo Setting Translation
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: seosetting
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: SeoSetting
                      inversedBy: translations
                    - name: locale
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: Locale
                      inversedBy: seosettingtranslatelocales
                    - name: meta_title
                      type: string
                      isstring: true
                    - name: meta_description
                      type: text
                    - name: meta_keywords
                      type: string
                    - name: author
                      type: string
                    - name: og_title
                      type: string
                    - name: og_description
                      type: text
                    - name: og_type
                      type: string
                    - name: og_image
                      type: image
                    - name: gtm_code
                      type: string

            FooterSetting:
                relatedSaleAndLocale: single
                translate:
                    link:
                        uk: Настройки Футера
                        uk_single: Настройка Футера
                        en: Footer Settings
                        en_single: Footer Setting
                fields:
                    -   name: id
                        type: integer
                        id: true
                    -   name: site
                        type: relation
                        typeRelation: ManyToOne
                        objectRelation: Site
                        inversedBy: footersettingsites
                        isstring: true
                    -   name: translations
                        type: relation
                        typeRelation: OneToMany
                        objectRelation: FooterTranslation
                        mappedBy: footersetting

            FooterTranslation:
                translate:
                    link:
                        uk: Переклад Футера
                        uk_single: Переклад Футера
                        en: Footer Translations
                        en_single: Footer Translation
                fields:
                    -   name: id
                        type: integer
                        id: true
                    -   name: footersetting
                        type: relation
                        typeRelation: ManyToOne
                        objectRelation: FooterSetting
                        isstring: true
                        inversedBy: translations
                    -   name: locale
                        type: relation
                        typeRelation: ManyToOne
                        objectRelation: Locale
                        inversedBy: footertranslatelocales
                    -   name: content
                        type: text
                        isHtml: true
                        numOfRows: 10

            MegaMenuSetting:
                relatedSaleAndLocale: multiplemenu
                translate:
                    link:
                        uk: Настройки Меню
                        uk_single: Настройка Меню
                        en: Menu Settings
                        en_single: Menu Setting
                fields:
                    -   name: id
                        type: integer
                        id: true
                    -   name: site
                        type: relation
                        typeRelation: ManyToOne
                        objectRelation: Site
                        inversedBy: megamenusites
                        isstring: true
                    -   name: translations
                        type: relation
                        typeRelation: OneToMany
                        objectRelation: MegaMenuTranslation
                        mappedBy: megamenusetting

            MegaMenuTranslation:
                translate:
                    link:
                        uk: Пункти Меню
                        uk_single: Пункт Меню
                        en: Menu Items
                        en_single: Menu Item
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: megamenusetting
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: MegaMenuSetting
                      inversedBy: translations
                    - name: locale
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: Locale
                      inversedBy: megamenutranslatelocales
                    - name: name
                      type: string
                      isrequire: true
                      isstring: true
                    - name: status
                      type: select
                      typeInput: yesno
                    - name: megamenutype
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: MegaMenuType
                      inversedBy: megamenutranslations
                    - name: position
                      type: integer
                    - name: url
                      type: string
                    - name: content
                      type: text
                      numOfRows: 10

            MegaMenuType:
                translate:
                    link:
                        uk: Типи Пунктів Меню
                        uk_single: Тип Пунктів Меню
                        en: Type Menu Items
                        en_single: Type Menu Item
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: name
                      type: string
                      isrequire: true
                      isstring: true
                    - name: megamenutranslations
                      type: relation
                      typeRelation: OneToMany
                      objectRelation: MegaMenuTranslation
                      mappedBy: megamenutype

            Popularsearch:
                relatedSaleAndLocale: singletwo
                translate:
                    link:
                        uk: Популярні пошукові слова
                        uk_single: Популярне пошукове слово
                        en: Popular search terms
                        en_single: Popular search term
                fields:
                    - name: id
                      type: integer
                      id: true
                    - name: name
                      type: string
                      isrequire: true
                      isstring: true
                    - name: image
                      type: image
                      uploadDir: recipes
                    - name: site
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: Site
                      roleRelation: master
                      inversedBy: popularsearchsites
                    - name: locale
                      type: relation
                      typeRelation: ManyToOne
                      objectRelation: Locale
                      inversedBy: Popularsearchlocales

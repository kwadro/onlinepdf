version: 1
groups:
  catalog:
    translate:
      link:
        uk: Каталог
        en: Catalog
    entities_dir: recipes/catalog
    json_catalog:
      schema_version: 1
      schema: data/schemas/recipe-catalog.v1.schema.json
      template: data/templates/recipe-catalog.template.json
      example: data/examples/recipe-catalog.example.json
      import_command: app:recipe:import-json
      export_command: app:recipe:export-json
      python_script: python/recipe_catalog.py
      simple_yaml_example: data/examples/recipe-simple.example.yaml
      ai_generate_command: generate
      ai_publish_command: publish
  setting:
    translate:
      link:
        uk: Настройки Сайта
        en: Setting Site
    entities_dir: recipes/setting
  mail:
    translate:
      link:
        uk: Пошта
        en: Mail
    entities_dir: recipes/mail
  subscription:
    translate:
      link:
        uk: Підписки
        en: Subscriptions
    entities_dir: recipes/subscription
    skip_dashboard: true
    skip_export: true
    output:
      package_root: packages/kwadro/user-subscription
      entity_namespace: 'Kwadro\UserSubscription\Entity'
      repository_namespace: 'Kwadro\UserSubscription\Repository'
      enum_namespace: 'Kwadro\UserSubscription\Enum'
      model_namespace: 'Kwadro\UserSubscription\Model'
      controller_namespace: 'App\Controller\Admin'
      controller_root: src/Controller/Admin
  planner:
    translate:
      link:
        uk: Планування
        en: Planning
    entities_dir: recipes/planner

translate:
  link:
    uk: Вхідні листи
    uk_single: Вхідний лист
    en: Inbound Emails
    en_single: Inbound Email
repository:
  template: mail-message
disable_import: true
skip_dashboard: true
crud:
  edit_only: true
fields:
- name: id
  type: integer
  id: true
- name: site
  type: relation
  typeRelation: ManyToOne
  objectRelation: Site
  inversedBy: emailmessagesites
  roleRelation: master
- name: mailbox
  type: relation
  typeRelation: ManyToOne
  objectRelation: EmailMailbox
  inversedBy: emailmessages
  roleRelation: master
- name: mailboxtype
  type: select
  typeInput: choices
  isrequire: true
  name_uk: Тип повідомлення
  choices:
      inbox: INBOX
      sent: SENT
- name: mailboxfolder
  type: relation
  typeRelation: ManyToOne
  objectRelation: EmailMailboxFolder
  inversedBy: emailmessages
  roleRelation: master
- name: emailfilter
  type: relation
  typeRelation: ManyToOne
  objectRelation: EmailFilter
  inversedBy: emailmessages
  roleRelation: master
- name: imap_uid
  type: integer
  isrequire: true
  name_uk: IMAP UID
- name: message_id
  type: string
  name_uk: Message-ID
  hideOnIndex: true
- name: parent_message_id
  type: string
  name_uk: Parent Message-ID
  hideOnIndex: true
- name: in_reply_to
  type: string
  name_uk: In Reply To
  hideOnIndex: true
- name: mailreferences
  type: string
  name_uk: References
  hideOnIndex: true
- name: from_address
  type: string
  isrequire: true
  name_uk: Відправник
  isstring: true
- name: from_name
  type: string
  name_uk: Ім'я відправника
- name: recipient
  type: string
  name_uk: Отримувач (To)
- name: subject
  type: string
  name_uk: Тема
- name: body_html
  type: text
  typeInput: tinymce_email
  name_uk: HTML листа
  hideOnIndex: true
- name: received_at
  type: datetime_immutable
  name_uk: Отримано
- name: is_seen
  type: select
  typeInput: yesno
  name_uk: Прочитано

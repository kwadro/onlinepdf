translate:
    link:
        uk: Поштові скриньки
        uk_single: Поштова скринька
        en: Mailboxes
        en_single: Mailbox
repository:
    template: mail-mailbox
disable_import: true
fields:
- name: id
  type: integer
  id: true
- name: site
  type: relation
  typeRelation: ManyToOne
  objectRelation: Site
  inversedBy: emailmailboxsites
  roleRelation: master
- name: folders
  type: relation
  typeRelation: OneToMany
  objectRelation: EmailMailboxFolder
  mappedBy: emailmailbox
- name: boxname
  type: string
  isrequire: true
  isstring: true
  name_uk: Назва
- name: boxhost
  type: string
  isrequire: true
  name_uk: IMAP хост
- name: boxport
  type: integer
  isrequire: true
  name_uk: Порт
- name: boxusername
  type: string
  isrequire: true
  name_uk: Логін
- name: boxpassword
  type: string
  isrequire: true
  name_uk: Пароль
- name: boxencryption
  type: select
  typeInput: choices
  isrequire: true
  name_uk: Шифрування
  choices:
    ssl: SSL ( порт 993)
    tls: TLS ( порт 143)
- name: boxactive
  type: select
  typeInput: yesno
  name_uk: Активна
- name: last_checked_at
  type: datetime
  name_uk: Остання перевірка
  hideOnForm: true
- name: emailmessages
  type: relation
  typeRelation: OneToMany
  objectRelation: EmailMessage
  mappedBy: mailbox
  hideOnForm: true
- name: filtergroups
  type: relation
  typeRelation: OneToMany
  objectRelation: EmailFilterGroup
  mappedBy: mailbox
  hideOnForm: true

translate:
  link:
    uk: Інградієнти
    uk_single: Інградієнт
    en: Ingredients
    en_single: Ingredient
import:
  type: json
  resource: recipe_categories.json
fields:
- name: id
  type: integer
  id: true
- name: name
  type: string
  isrequire: true
  isstring: true
- name: sku
  type: string
- name: unit
  type: relation
  objectRelation: Unit
  typeRelation: ManyToOne
  roleRelation: master
  inversedBy: ingredients
  typeInput: addNew
  formSetting: name|name
- name: components
  type: relation
  objectRelation: Component
  typeRelation: OneToMany
  mappedBy: ingredient
- name: products
  type: relation
  objectRelation: Product
  typeRelation: OneToMany
  mappedBy: ingredient

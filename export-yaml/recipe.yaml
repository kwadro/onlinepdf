            meta_title: 'Український борщ — класичний домашній рецепт'
            meta_description: 'Покроковий рецепт українського борщу: інгредієнти, поради та час приготування.'
            short_description: "Традиційний український борщ\nіз буряком, м’ясом та овочами\nнасичений, ароматний і ситний."
            description: 'Український борщ — одна з найвідоміших страв національної кухні. Його готують на м’ясному бульйоні з буряком, капустою, картоплею та іншими овочами. Завдяки правильному поєднанню інгредієнтів борщ має глибокий смак і яскравий колір. Подається зі сметаною та зеленню, часто з пампушками.'
            cuisine: Українська
            notes: 'На наступний день буде смачніше'
            locale: Українська

                -
                    id: '5'
                    name: Завершення
                    position: '5'
                    answer: "Додай:\nподрібнений часник\nлавровий лист\nчорний перець\nдрібно нарізану зелень\nВимкни вогонь і дай борщу настоятися 15–20 хвилин під кришкою."
                    recipetranslation: 'Український борщ'
                -
                    id: '22'
                    name: 'Обсмажування овочів'
                    position: '6'
                    answer: 'Обсмажити цибулю та моркву до золотистого кольору.'
                    recipetranslation: 'Український борщ'
                -
                    id: '23'
                    name: 'Додавання картоплі'
                    position: '7'
                    answer: 'Дістати м’ясо з бульйону, нарізати шматочками і повернути назад. Додати картоплю та варити 10 хвилин.'
                    recipetranslation: 'Український борщ'
                -
                    id: '24'
                    name: 'Додавання капусти'
                    position: '8'
                    answer: 'Додати нашатковану капусту та варити ще 5–7 хвилин.'
                    recipetranslation: 'Український борщ'
                -
                    id: '25'
                    name: 'Змішування інгредієнтів'
                    position: '9'
                    answer: 'Додати буряк, обсмажені овочі, лавровий лист, сіль і спеції.'
                    recipetranslation: 'Український борщ'
                -
                    id: '27'
                    name: Настоювання
                    position: '11'
                    answer: 'Зняти борщ з вогню і дати настоятися 20–30 хвилин перед подачею.'
                    recipetranslation: 'Український борщ'

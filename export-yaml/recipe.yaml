                    id: '3'
                    name: 'Засмажка (серце борщу)'
                    position: '3'
                    answer: "обсмаж цибулю до прозорості\nдодай моркву — смаж 2–3 хвилини\nдодай буряк, томатну пасту та трохи бульйону\nтуши 5–7 хвилин на малому вогні\nЗа бажанням додай дрібку цукру або кілька крапель оцту / лимонного соку — це збереже колір буряка."

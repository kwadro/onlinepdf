            recipesteps:
                -
                    id: '1'
                    name: 'Приготування бульйону.'
                    position: '1'
                    answer: "Поклади м’ясо (яловичину або свинину на кістці) у велику каструлю, \nзалий холодною водою та постав на середній вогонь.\nПісля закипання зніми піну, зменш вогонь і вари бульйон 60–90 хвилин до м’якості м’яса.\nПосоли за смаком."
                    recipetranslation: 'Український борщ'
                -
                    id: '2'
                    name: 'Підготовка овочів'
                    position: '2'
                    answer: "Поки вариться бульйон:\nкартоплю почисть і наріж кубиками\nкапусту нашаткуй тонкою соломкою\nбуряк натри на великій тертці або наріж соломкою\nморкву натри\nцибулю дрібно наріж"
                    recipetranslation: 'Український борщ'
